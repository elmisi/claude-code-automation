name: Check Claude Code Docs for Schema Updates

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for documentation changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DISCREPANCIES=""

          fetch_page() {
            local url="$1"
            local output="$2"
            curl -sL --retry 3 --retry-delay 5 --max-time 30 "$url" -o "$output"
            [ -s "$output" ] || { echo "WARNING: Failed to fetch $url"; return 1; }
          }

          echo "Fetching Claude Code documentation pages..."
          mkdir -p /tmp/docs
          fetch_page "https://code.claude.com/docs/en/hooks" /tmp/docs/hooks.html || true
          fetch_page "https://code.claude.com/docs/en/tools-reference" /tmp/docs/tools-reference.html || true
          fetch_page "https://code.claude.com/docs/en/sub-agents" /tmp/docs/subagents.html || true

          # ==============================================
          # 1. Check hook events
          #    Pattern: <code>EventName</code></td><td
          #    This matches only event names in the hooks table
          # ==============================================
          echo ""
          echo "=== Checking hook events ==="

          SCHEMA_EVENTS=$(jq -r '.validEvents[]' plugin/schemas/hooks.json | sort)
          SCHEMA_EVENT_COUNT=$(echo "$SCHEMA_EVENTS" | wc -l)
          echo "Schema has $SCHEMA_EVENT_COUNT hook events"

          if [ -s /tmp/docs/hooks.html ]; then
            DOCS_EVENTS=$(grep -oP '<code>([A-Z][a-zA-Z]+)</code></td><td' /tmp/docs/hooks.html \
              | grep -oP '<code>\K[A-Z][a-zA-Z]+' | sort -u)

            if [ -n "$DOCS_EVENTS" ]; then
              DOCS_EVENT_COUNT=$(echo "$DOCS_EVENTS" | wc -l)
              echo "Docs table has $DOCS_EVENT_COUNT events"

              NEW_EVENTS=$(comm -23 <(echo "$DOCS_EVENTS") <(echo "$SCHEMA_EVENTS") || true)
              if [ -n "$NEW_EVENTS" ]; then
                DISCREPANCIES="${DISCREPANCIES}\n### New hook events in docs, missing from schema\n\n"
                DISCREPANCIES="${DISCREPANCIES}The following events appear in the [hooks docs table](https://code.claude.com/docs/en/hooks) but not in \`plugin/schemas/hooks.json\`:\n"
                while IFS= read -r event; do
                  DISCREPANCIES="${DISCREPANCIES}\n- \`$event\`"
                done <<< "$NEW_EVENTS"
                DISCREPANCIES="${DISCREPANCIES}\n"
              fi

              REMOVED_EVENTS=$(comm -13 <(echo "$DOCS_EVENTS") <(echo "$SCHEMA_EVENTS") || true)
              if [ -n "$REMOVED_EVENTS" ]; then
                REMOVED_COUNT=$(echo "$REMOVED_EVENTS" | wc -l)
                if [ "$REMOVED_COUNT" -gt 2 ]; then
                  DISCREPANCIES="${DISCREPANCIES}\n### Schema events missing from docs ($REMOVED_COUNT events)\n\n"
                  DISCREPANCIES="${DISCREPANCIES}These events are in the schema but not found in the docs table (possibly removed or renamed):\n"
                  while IFS= read -r event; do
                    DISCREPANCIES="${DISCREPANCIES}\n- \`$event\`"
                  done <<< "$REMOVED_EVENTS"
                  DISCREPANCIES="${DISCREPANCIES}\n"
                fi
              fi
            else
              echo "WARNING: Could not extract events from hooks page table"
            fi
          fi

          # ==============================================
          # 2. Check hook handler types
          #    Look for type keywords in specific contexts
          # ==============================================
          echo ""
          echo "=== Checking hook handler types ==="

          SCHEMA_TYPES=$(jq -r '.validTypes[]' plugin/schemas/hooks.json | sort)
          echo "Schema types: $(echo $SCHEMA_TYPES | tr '\n' ' ')"

          if [ -s /tmp/docs/hooks.html ]; then
            # Check for new handler types by looking at the "type" field values in the docs
            for candidate in stdio sse grpc websocket webhook graphql; do
              # Only match in structured contexts like "type": "candidate" or type.*candidate
              if grep -qP "\"type\"[^\"]*\"${candidate}\"|type.*:.*${candidate}" /tmp/docs/hooks.html; then
                if ! echo "$SCHEMA_TYPES" | grep -qx "$candidate"; then
                  DISCREPANCIES="${DISCREPANCIES}\n### New hook handler type: \`$candidate\`\n\n"
                  DISCREPANCIES="${DISCREPANCIES}Found in [hooks docs](https://code.claude.com/docs/en/hooks) but not in schema.\n"
                fi
              fi
            done
          fi

          # ==============================================
          # 3. Check tools reference
          #    Pattern: <code>ToolName</code></td><td
          #    This matches only tool names in the tools table
          # ==============================================
          echo ""
          echo "=== Checking tools reference ==="

          SCHEMA_TOOLS=$(jq -r '.frontmatter.optional.tools.validValues[]' plugin/schemas/subagents.json | sort)
          SCHEMA_TOOL_COUNT=$(echo "$SCHEMA_TOOLS" | wc -l)
          echo "Schema has $SCHEMA_TOOL_COUNT tools"

          if [ -s /tmp/docs/tools-reference.html ]; then
            DOCS_TOOLS=$(grep -oP '<code>([A-Z][a-zA-Z]+)</code></td><td' /tmp/docs/tools-reference.html \
              | grep -oP '<code>\K[A-Z][a-zA-Z]+' | sort -u)

            if [ -n "$DOCS_TOOLS" ]; then
              DOCS_TOOL_COUNT=$(echo "$DOCS_TOOLS" | wc -l)
              echo "Docs table has $DOCS_TOOL_COUNT tools"

              NEW_TOOLS=$(comm -23 <(echo "$DOCS_TOOLS") <(echo "$SCHEMA_TOOLS") || true)
              if [ -n "$NEW_TOOLS" ]; then
                DISCREPANCIES="${DISCREPANCIES}\n### New tools in docs, missing from schema\n\n"
                DISCREPANCIES="${DISCREPANCIES}The following tools appear in the [tools reference table](https://code.claude.com/docs/en/tools-reference) but not in \`plugin/schemas/subagents.json\`:\n"
                while IFS= read -r tool; do
                  DISCREPANCIES="${DISCREPANCIES}\n- \`$tool\`"
                done <<< "$NEW_TOOLS"
                DISCREPANCIES="${DISCREPANCIES}\n"
              fi

              REMOVED_TOOLS=$(comm -13 <(echo "$DOCS_TOOLS") <(echo "$SCHEMA_TOOLS") || true)
              if [ -n "$REMOVED_TOOLS" ]; then
                REMOVED_COUNT=$(echo "$REMOVED_TOOLS" | wc -l)
                if [ "$REMOVED_COUNT" -gt 2 ]; then
                  DISCREPANCIES="${DISCREPANCIES}\n### Schema tools missing from docs ($REMOVED_COUNT tools)\n\n"
                  DISCREPANCIES="${DISCREPANCIES}These tools are in the schema but not in the docs table:\n"
                  while IFS= read -r tool; do
                    DISCREPANCIES="${DISCREPANCIES}\n- \`$tool\`"
                  done <<< "$REMOVED_TOOLS"
                  DISCREPANCIES="${DISCREPANCIES}\n"
                fi
              fi
            else
              echo "WARNING: Could not extract tools from tools-reference page table"
            fi
          fi

          # ==============================================
          # 4. Check subagent frontmatter fields
          # ==============================================
          echo ""
          echo "=== Checking subagent frontmatter ==="

          if [ -s /tmp/docs/subagents.html ]; then
            # Extract field names from the frontmatter fields table
            DOCS_FIELDS=$(grep -oP '<code>([a-zA-Z]+)</code></td><td' /tmp/docs/subagents.html \
              | grep -oP '<code>\K[a-zA-Z]+' | sort -u)

            EXPECTED_FIELDS="background description disallowedTools hooks isolation maxTurns mcpServers memory model name permissionMode skills tools"
            for field in $EXPECTED_FIELDS; do
              if [ -n "$DOCS_FIELDS" ] && ! echo "$DOCS_FIELDS" | grep -qx "$field"; then
                echo "Note: expected field '$field' not in docs table (may have been renamed)"
              fi
            done

            if [ -n "$DOCS_FIELDS" ]; then
              for field in $DOCS_FIELDS; do
                if ! echo "$EXPECTED_FIELDS" | tr ' ' '\n' | grep -qx "$field"; then
                  DISCREPANCIES="${DISCREPANCIES}\n### New subagent frontmatter field: \`$field\`\n\n"
                  DISCREPANCIES="${DISCREPANCIES}Found in [sub-agents docs](https://code.claude.com/docs/en/sub-agents) frontmatter table but not tracked in schema.\n"
                fi
              done
            fi
          fi

          # ==============================================
          # 5. Report results
          # ==============================================
          echo ""
          echo "=============================="

          if [ -z "$DISCREPANCIES" ]; then
            echo "No discrepancies found. Schemas appear up to date."
            exit 0
          fi

          echo "Discrepancies found! Creating GitHub issue..."

          ISSUE_BODY=$(cat <<BODYEOF
          ## Documentation Change Detected

          The daily docs check found differences between the Claude Code documentation and this project's schemas.
          $(echo -e "$DISCREPANCIES")

          ## Action Required

          1. Review the documentation pages linked above
          2. Update the relevant schema files in \`plugin/schemas/\`
          3. Update \`plugin/scripts/validate-config.sh\` if validation logic changed
          4. Update \`SKILL.md\` inline lists if events/tools changed
          5. Run \`./tests/scripts/run-tests.sh structure\` to verify

          ---
          *Auto-generated by the \`check-docs-updates\` workflow.*
          BODYEOF
          )

          EXISTING=$(gh issue list --label "schema-update" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Adding comment to existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$ISSUE_BODY"
          else
            gh label create "schema-update" --description "Schema needs updating due to Claude Code docs changes" --color "D93F0B" 2>/dev/null || true
            gh issue create \
              --title "Schema update needed: Claude Code docs changed" \
              --body "$ISSUE_BODY" \
              --label "schema-update"
          fi
