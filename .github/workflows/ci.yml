name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run structure tests
        run: ./tests/scripts/run-tests.sh structure

      - name: Run E2E fixture tests
        run: ./tests/scripts/run-tests.sh e2e

      - name: Validate fixtures against schemas
        run: |
          SCRIPT="./plugins/automate/scripts/validate-config.sh"
          chmod +x "$SCRIPT"

          echo "Validating hook fixture..."
          "$SCRIPT" hooks ./tests/fixtures/hook-only.json

          echo "Validating skill fixtures..."
          "$SCRIPT" skill ./tests/fixtures/skill-auto.md
          "$SCRIPT" skill ./tests/fixtures/skill-manual.md

          echo "Validating subagent fixture..."
          "$SCRIPT" subagent ./tests/fixtures/subagent.md

          echo "Validating permissions fixture..."
          "$SCRIPT" permissions ./tests/fixtures/permissions.json

          echo "Validating custom-command fixture..."
          "$SCRIPT" custom-commands ./tests/fixtures/custom-command.json

          echo "Validating MCP server fixture..."
          "$SCRIPT" mcp-servers ./tests/fixtures/mcp-server.json

          echo "Validating LSP server fixture..."
          "$SCRIPT" lsp-servers ./tests/fixtures/lsp-server.json

          echo "Validating agent team fixture..."
          "$SCRIPT" agent-team ./tests/fixtures/agent-team.json

          echo "All fixtures validated successfully."

      - name: Validate review-cycle fixtures
        run: |
          RC="./plugins/review-cycle/scripts"
          FX="./tests/fixtures/review-cycle"
          chmod +x "$RC"/*.sh

          echo "Shape rules accept a well-formed review..."
          "$RC/rc-validate.sh" "$FX/review-valid.md"

          echo "Shape rules reject an outcome with no declared consequence..."
          if "$RC/rc-validate.sh" "$FX/review-missing-consequence.md" 2>/dev/null; then
            echo "rc-validate accepted a finding with no Consequence" >&2; exit 1
          fi

          echo "Shape rules reject an open question with no alternative..."
          if "$RC/rc-validate.sh" "$FX/open-question-without-alternative.md" 2>/dev/null; then
            echo "rc-validate accepted an open question with no Alternative/Cost" >&2; exit 1
          fi

          echo "Risk floor routes a migration to the strict lane..."
          [ "$("$RC/rc-floor.sh" "$FX/inventory-sample.json" | jq -r .floor)" = "strict" ]

          echo "Risk floor routes a docs-only change to skip..."
          [ "$("$RC/rc-floor.sh" "$FX/inventory-docs-only.json" | jq -r .floor)" = "skip" ]

          echo "review-cycle fixtures validated successfully."
          # rc-guard.sh needs a sandbox repository, so it stays covered by
          # run-tests.sh e2e, which this workflow already runs.
